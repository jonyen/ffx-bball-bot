AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Basketball Slack bot — twice-weekly roll-call for Nottoway Park, Vienna, VA

Parameters:
  SlackBotToken:
    Type: String
    NoEcho: true
    Description: Slack bot OAuth token (xoxb-...)
  SlackSigningSecret:
    Type: String
    NoEcho: true
    Description: Slack signing secret for webhook verification
  SlackBotUserId:
    Type: String
    Description: Slack user ID of the bot itself (used to filter reactions on own messages)
  SlackChannels:
    Type: String
    Description: Comma-separated list of target Slack channel IDs
  FailureDmUser:
    Type: String
    Default: ""
    Description: >-
      Slack user ID DMed on unrecoverable failures. Optional — unset means
      failure notices are logged instead of sent.
  AlarmChannel:
    Type: String
    Default: ""
    Description: >-
      Slack channel ID for CloudWatch alarm notifications. Optional — unset
      means alarms still fire to SNS but are not relayed to Slack.
  ScheduleExpression:
    Type: String
    Default: cron(0 8 ? * TUE,THU *)
    Description: >-
      EventBridge Scheduler expression for the twice-weekly roll-call post.
      scripts/deploy.sh reads the current live value from EventBridge and
      passes it in here so runtime changes via /ball schedule persist across
      deploys.
  GitSha:
    Type: String
    Default: unknown
    Description: Commit SHA being deployed; surfaced via /ball info.
  GithubRunNumber:
    Type: String
    Default: unknown
    Description: GitHub Actions run number for the deploy; surfaced via /ball info.

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 256
    Timeout: 10
    Architectures: [arm64]
    Environment:
      Variables:
        SLACK_BOT_TOKEN: !Ref SlackBotToken
        SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
        SLACK_BOT_USER_ID: !Ref SlackBotUserId
        SLACK_CHANNELS: !Ref SlackChannels
        FAILURE_DM_USER: !Ref FailureDmUser

Resources:
  PostMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ffx-bball-post-message
      CodeUri: ../src/
      Handler: postMessage/handler.handler
      Description: Posts the basketball roll-call message twice a week
      # Headroom for up to 3 weather-fetch attempts (8s each) before posting.
      Timeout: 30

  PostScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePostMessage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PostMessageFunction.Arn

  PostSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ffx-bball-post-schedule
      Description: Tue/Thu 8am ET basketball roll-call (DST-aware)
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt PostMessageFunction.Arn
        RoleArn: !GetAtt PostScheduleRole.Arn

  ReactionHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ffx-bball-reaction-handler
      CodeUri: ../src/
      Handler: reactionHandler/handler.handler
      Description: Handles Slack reaction events and updates the roll-call message
      Events:
        SlackEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref SlackEventsApi
            Method: POST
            Path: /slack/events

  SlashCommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ffx-bball-slash-command
      CodeUri: ../src/
      Handler: slashCommand/handler.handler
      Description: Handles the /ball slash command and posts a custom roll-call message
      Environment:
        Variables:
          SCHEDULE_NAME: !Ref PostSchedule
          SCHEDULE_GROUP: default
          GIT_SHA: !Ref GitSha
          GITHUB_RUN_NUMBER: !Ref GithubRunNumber
          WEATHER_EDIT_FUNCTION: !Ref WeatherEditFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:GetSchedule
                - scheduler:UpdateSchedule
              Resource: !GetAtt PostSchedule.Arn
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt PostScheduleRole.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt WeatherEditFunction.Arn
      Events:
        SlackCommand:
          Type: HttpApi
          Properties:
            ApiId: !Ref SlackEventsApi
            Method: POST
            Path: /slack/commands

  WeatherEditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ffx-bball-weather-edit
      CodeUri: ../src/
      Handler: slashCommand/weatherEdit.handler
      Description: >-
        Async worker for /ball. Fetches weather out-of-band (with retry) and
        edits the weather line into the already-posted roll-call message, so the
        slash command can return its 200 to Slack within the 3s deadline.
      # Headroom for up to 3 weather-fetch attempts (8s each) before editing.
      Timeout: 30

  # ---------------------------------------------------------------------------
  # Observability
  #
  # Alarms publish to SNS, and a dedicated Lambda relays them to Slack. Keeping
  # the alert path off the bot's own code path matters: the alarms worth having
  # are the ones that fire because the bot is broken. Subscribe an email address
  # to this topic for a path that survives a Slack outage.
  # ---------------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ffx-bball-alarms
      DisplayName: ffx-bball-bot alarms

  AlarmNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ffx-bball-alarm-notifier
      CodeUri: ../src/
      Handler: alarmNotifier/handler.handler
      Description: Relays CloudWatch alarm state changes into Slack
      Environment:
        Variables:
          ALARM_CHANNEL: !Ref AlarmChannel
      Events:
        Alarms:
          Type: SNS
          Properties:
            Topic: !Ref AlarmTopic

  # The SLI alarm. Lambda can finish cleanly having posted nothing, so error
  # count alone never catches a silently dead scheduler; this watches the
  # business outcome instead.
  #
  # Posts land Tue and Thu, so the longest healthy gap is Thu -> Tue: four
  # consecutive zero days (Fri, Sat, Sun, Mon). Five is therefore the smallest
  # window that cannot false-fire, and it surfaces a dead schedule roughly a day
  # after the first missed Tuesday. Tightening this means encoding day-of-week,
  # which CloudWatch alarms cannot express.
  RollCallMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ffx-bball-roll-call-missing
      AlarmDescription: >-
        No roll call has posted for five consecutive days. Expected Tue and Thu,
        so this means the schedule, the Lambda, or Slack posting is broken.
      Namespace: FfxBballBot
      MetricName: RollCallPosted
      Dimensions:
        - Name: Lambda
          Value: postMessage
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  RollCallFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ffx-bball-roll-call-failures
      AlarmDescription: A roll call failed to post to at least one channel.
      Namespace: FfxBballBot
      MetricName: RollCallFailed
      Dimensions:
        - Name: Lambda
          Value: postMessage
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ffx-bball-function-errors
      AlarmDescription: >-
        A Lambda threw. Check the structured logs for the correlationId in the
        same window.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PostMessageFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  SlashCommandLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ffx-bball-slash-command-slow
      AlarmDescription: >-
        /ball p99 is approaching Slack's 3s deadline. Past it, Slack shows the
        user an operation_timeout even though the command succeeds.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref SlashCommandFunction
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: ffx-bball-bot
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Roll calls posted vs failed",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 86400,
                "metrics": [
                  [ "FfxBballBot", "RollCallPosted", "Lambda", "postMessage" ],
                  [ ".", "RollCallFailed", ".", "." ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Errors by function",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${PostMessageFunction}" ],
                  [ "...", "${ReactionHandlerFunction}" ],
                  [ "...", "${SlashCommandFunction}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "/ball latency (p50 / p99) against Slack's 3s deadline",
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": { "left": { "min": 0 } },
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${SlashCommandFunction}", { "stat": "p50" } ],
                  [ "...", { "stat": "p99" } ]
                ],
                "annotations": {
                  "horizontal": [ { "label": "Slack deadline", "value": 3000 } ]
                }
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Invocations",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 3600,
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${PostMessageFunction}" ],
                  [ "...", "${ReactionHandlerFunction}" ],
                  [ "...", "${SlashCommandFunction}" ]
                ]
              }
            }
          ]
        }

  SlackEventsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

Outputs:
  SlackEventsUrl:
    Description: POST this URL into the Slack app's Event Subscriptions Request URL
    Value: !Sub https://${SlackEventsApi}.execute-api.${AWS::Region}.amazonaws.com/slack/events
  SlackCommandsUrl:
    Description: POST this URL into the Slack app's /ball slash command Request URL
    Value: !Sub https://${SlackEventsApi}.execute-api.${AWS::Region}.amazonaws.com/slack/commands
  PostMessageFunctionArn:
    Value: !GetAtt PostMessageFunction.Arn
  ReactionHandlerFunctionArn:
    Value: !GetAtt ReactionHandlerFunction.Arn
  SlashCommandFunctionArn:
    Value: !GetAtt SlashCommandFunction.Arn
  AlarmTopicArn:
    Description: Subscribe an email address here for an alert path independent of Slack
    Value: !Ref AlarmTopic
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=ffx-bball-bot
