AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  GitHub Actions OIDC trust for ffx-bball-bot. One-time bootstrap stack:
  creates an IAM role that the repo's Deploy workflow assumes via OIDC,
  plus (optionally) the GitHub OIDC identity provider itself.

Parameters:
  GitHubOrg:
    Type: String
    Default: jonyen
    Description: GitHub org or user that owns the repository.

  GitHubRepo:
    Type: String
    Default: ffx-bball-bot
    Description: Repository name (without the org prefix).

  SubjectFilter:
    Type: String
    Default: '*'
    Description: >-
      Value for the token.actions.githubusercontent.com:sub claim filter.
      "*" allows any ref/environment (matches the default Deploy workflow).
      Tighten to e.g. "environment:production" to only allow runs that
      target the production environment, or "ref:refs/heads/main" to lock
      to the main branch.

  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether to create the GitHub OIDC provider. Set to "false" if you
      already have one in this AWS account (providers are account-global,
      so only one GitHub provider can exist per account).

  ExistingProviderArn:
    Type: String
    Default: ''
    Description: >-
      If CreateOidcProvider=false, pass the existing provider ARN here,
      e.g. arn:aws:iam::111111111111:oidc-provider/token.actions.githubusercontent.com

  DeployRoleName:
    Type: String
    Default: ffx-bball-bot-github-deploy
    Description: Name for the IAM role the workflow assumes.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # Well-known GitHub Actions thumbprint. AWS now verifies GitHub
        # tokens against Actions' live TLS chain, so this value is
        # effectively a required placeholder.
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeployRoleName
      Description: Assumed by GitHub Actions to deploy ffx-bball-bot via SAM.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:${SubjectFilter}'
      # Scoped to what a SAM deploy of this stack actually touches, rather than
      # AdministratorAccess. Every resource in the app template is named
      # ffx-bball-*, which makes prefix scoping practical.
      #
      # The IAM statement enumerates actions instead of using iam:*, and is
      # scoped to ffx-bball-bot-* — which excludes this role itself
      # (ffx-bball-bot, no trailing hyphen), so a compromised workflow cannot
      # widen its own permissions.
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationStacks
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ffx-bball-bot/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: CloudFormationReadOnlyGlobals
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                  - cloudformation:DescribeStacks
                Resource: '*'
              - Sid: SamArtifactBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - 'arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*'
                  - 'arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*'
              - Sid: ListBucketsForSam
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:CreateBucket
                Resource: '*'
              - Sid: Functions
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ffx-bball-*'
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ffx-bball-*:*'
              - Sid: LambdaAccountReads
                Effect: Allow
                Action:
                  - lambda:GetAccountSettings
                  - lambda:ListFunctions
                Resource: '*'
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/ffx-bball-bot-*'
              - Sid: HttpApi
                Effect: Allow
                Action: apigateway:*
                Resource: !Sub 'arn:aws:apigateway:${AWS::Region}::/*'
              - Sid: PostSchedule
                Effect: Allow
                Action: scheduler:*
                Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/ffx-bball-post-schedule'
              - Sid: SchedulerReads
                Effect: Allow
                Action:
                  - scheduler:ListSchedules
                  - scheduler:ListScheduleGroups
                Resource: '*'
              - Sid: AlarmTopic
                Effect: Allow
                Action: sns:*
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:ffx-bball-alarms'
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:EnableAlarmActions
                  - cloudwatch:DisableAlarmActions
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:ffx-bball-*'
              - Sid: AlarmAndDashboardReads
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                  - cloudwatch:ListDashboards
                Resource: '*'
              - Sid: FunctionLogGroups
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ffx-bball-*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ffx-bball-*:*'
              - Sid: LogGroupReads
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: Paste this into the repo's AWS_DEPLOY_ROLE_ARN secret.
    Value: !GetAtt DeployRole.Arn

  ProviderArn:
    Description: ARN of the GitHub OIDC provider in use.
    Value: !If
      - ShouldCreateProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingProviderArn

  NextSteps:
    Description: Post-bootstrap checklist.
    Value: !Sub |
      1. Copy DeployRoleArn above.
      2. Open https://github.com/${GitHubOrg}/${GitHubRepo}/settings/secrets/actions
      3. New repository secret: name=AWS_DEPLOY_ROLE_ARN, value=<DeployRoleArn>.
      4. Add SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, SLACK_BOT_USER_ID as
         repo secrets, and SLACK_CHANNELS as a repo variable.
      5. Push to main or run the Deploy workflow manually from the Actions tab.
